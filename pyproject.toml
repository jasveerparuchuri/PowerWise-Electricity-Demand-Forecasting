[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerwise-electricity-forecasting"
version = "0.1.0"
description = "Beginner-friendly electricity forecasting and NumPy neural network lessons"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.42"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
